services:
  - type: web
    name: newssite-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    rootDir: .
    # --include=dev is required even though a root .npmrc also forces it: NODE_ENV=production (set
    # below) makes npm infer omit=dev, which would otherwise skip turbo/prisma/typescript/@nestjs/cli
    # (all devDependencies) and break this exact build with "turbo: not found".
    buildCommand: npm install --include=dev && npx turbo run build --filter=api
    startCommand: npm run start:prod --workspace=api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Provisioned Aiven Postgres connection string. Must use sslmode=require. Set in the Render
      # dashboard, never committed — see docs/DATABASE-SAFETY.md before touching this value.
      - key: DATABASE_URL
        sync: false
      # generateValue lets Render create a strong random secret itself on first deploy (masked in the
      # dashboard, never in this file) instead of requiring a manual paste — sync:false alone left these
      # unset, which is exactly what caused "Missing production configuration: JWT_SECRET,
      # JWT_REFRESH_SECRET" at boot. Still mandatory; apps/api/src/main.ts still refuses to start without
      # them and still rejects the literal dev placeholder string.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      # Canonical production URLs — fill in with the actual deployed Vercel/Render domains once known.
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      # Comma-separated exact origins for the web and admin apps (no wildcards in production).
      - key: API_CORS_ORIGIN
        sync: false
      - key: MEDIA_STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: news-media
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_NEWS_PUBLICATION_NAME
        value: BD News
